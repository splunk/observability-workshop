apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-assistant-eu
  labels:
    app: healthcare-assistant-eu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-assistant-eu
  template:
    metadata:
      labels:
        app: healthcare-assistant-eu
    spec:
      containers:
        - name: healthcare-assistant-eu
          image: ghcr.io/splunk/healthcare-assistant:app-with-controls-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: healthcare-assistant-config
            - configMapRef:
                name: postgres-config
            - configMapRef:
                name: splunk-ao-config-eu-splunk-show
            - configMapRef:
                name: splunk-agent-control-config-eu-splunk-show
          env:
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openai-api
                  key: openai-api-endpoint
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api
                  key: openai-api-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPLUNK_AO_O11Y_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-ao-secret-eu-splunk-show
                  key: SPLUNK_AO_O11Y_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-assistant-service-eu
spec:
  selector:
    app: healthcare-assistant-eu
  ports:
    - port: 8501
      protocol: TCP
  type: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: healthcare-assistant-tls-eu
  namespace: default
spec:
  secretName: healthcare-assistant-tls-eu
  dnsNames:
    - healthcare-assistant-eu-splunk-show.splunko11y.com
  issuerRef:
    name: letsencrypt-prod          # your existing ClusterIssuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-assistant-ingress-eu
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-basicauth@kubernetescrd
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - healthcare-assistant-eu-splunk-show.splunko11y.com
      secretName: healthcare-assistant-tls-eu

  rules:
    - host: healthcare-assistant-eu-splunk-show.splunko11y.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-assistant-service-eu
                port:
                  number: 8501
