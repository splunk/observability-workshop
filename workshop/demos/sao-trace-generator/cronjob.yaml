apiVersion: batch/v1
kind: CronJob
metadata:
  name: sao-trace-generator
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sao-trace-generator
              image: ghcr.io/splunk/sao-trace-generator:1.0
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: sao-trace-generator-config
              env:
                - name: SPLUNK_AO_O11Y_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sao-trace-generator-secret
                      key: SPLUNK_AO_O11Y_TOKEN
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
