# Single-Agent configuration for the .conf26 Advanced Collector workshop.
# Local debug and file output are always enabled. When cloud export is selected
# during setup, the same traces and metrics pipelines also send to Splunk
# Observability Cloud.

extensions:
  health_check:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:13133"

receivers:
  # Match the original workshop: collect one CPU batch at startup, then hourly.
  host_metrics:
    collection_interval: 3600s
    scrapers:
      cpu:
  otlp:
    protocols:
      http:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:4318"
  file_log/quotes:
    include: [./quotes.log]
    start_at: beginning
    include_file_path: true
    resource:
      service.name: quote-generator
      com.splunk.source: ./quotes.log
      com.splunk.sourcetype: quotes

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
  resource_detection:
    detectors: [system]
    override: true
  resource/add_mode:
    attributes:
      - action: upsert
        key: otelcol.service.mode
        value: agent

exporters:
  debug:
    verbosity: detailed
  file/traces:
    path: ./agent-traces.out
    append: false
  file/metrics:
    path: ./agent-metrics.out
    append: false
  file/logs:
    path: ./agent-logs.out
    append: false
  otlp_http:
    traces_endpoint: "${SPLUNK_INGEST_URL}/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    api_url: "${SPLUNK_API_URL}"
    ingest_url: "${SPLUNK_INGEST_URL}"
    sync_host_metadata: true

service:
  telemetry:
    logs:
      level: ${env:SPLUNK_COLLECTOR_LOG_LEVEL:-info}
    resource:
      attributes:
        - name: otelcol.service.mode
          value: agent
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/add_mode]
      exporters: [debug, file/traces, otlp_http]
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resource_detection, resource/add_mode]
      exporters: [debug, file/metrics, signalfx]
    logs:
      receivers: [otlp, file_log/quotes]
      processors: [memory_limiter, resource_detection, resource/add_mode]
      exporters: [debug, file/logs]
