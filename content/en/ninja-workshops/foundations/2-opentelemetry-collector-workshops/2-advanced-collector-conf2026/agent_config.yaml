# Splunk Distribution of the OpenTelemetry Collector Agent configuration for
# the .conf26 Advanced Collector workshop.
#
# DEFAULT: Components and pipelines from the Splunk Distribution default Agent
# configuration linked from Step 1.6.
# WORKSHOP: A FileLog receiver, resource/add_mode processor, debug exporter,
# and per-signal file exporters used by the hands-on local exercises.
#
# The portable binary requires the setup script to define these variables:
# SPLUNK_ACCESS_TOKEN, SPLUNK_API_URL, SPLUNK_HEC_TOKEN, SPLUNK_HEC_URL,
# SPLUNK_INGEST_URL, SPLUNK_LISTEN_INTERFACE, and SPLUNK_MEMORY_LIMIT_MIB.

extensions:
  headers_setter:
    headers:
      - action: upsert
        key: X-SF-TOKEN
        from_context: X-SF-TOKEN
        default_value: "${SPLUNK_ACCESS_TOKEN}"
  health_check:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:13133"
  http_forwarder:
    ingress:
      endpoint: "${SPLUNK_LISTEN_INTERFACE}:6060"
    egress:
      endpoint: "${SPLUNK_API_URL}"
  http_forwarder/opamp_splunk_o11y:
    ingress:
      endpoint: "${SPLUNK_LISTEN_INTERFACE}:4320"
    egress:
      endpoint: "${SPLUNK_INGEST_URL}"
      headers:
        X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
  # Startup removes this extension unless the splunk.opamp.enabled feature
  # gate is enabled. It remains here because it is part of the default config.
  opamp/splunk_o11y:
    agent_description:
      include_resource_attributes: true
    server:
      http:
        endpoint: "${SPLUNK_INGEST_URL}/v1/opamp"
        polling_interval: 30s
        headers:
          X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
  zpages:
    expvar:
      enabled: true

receivers:
  fluent_forward:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:8006"
  host_metrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
      memory:
      network:
      load:
      paging:
      processes:
  jaeger:
    protocols:
      grpc:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:14250"
      thrift_binary:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:6832"
      thrift_compact:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:6831"
      thrift_http:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:14268"
  otlp:
    protocols:
      grpc:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:4317"
      http:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:4318"
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 10s
          static_configs:
            - targets: ["127.0.0.1:8888"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'promhttp_metric_handler_errors.*'
              action: drop
            - source_labels: [__name__]
              regex: 'otelcol_processor_batch_.*'
              action: drop
  smartagent/processlist:
    type: processlist
  zipkin:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:9411"
  nop:

  # WORKSHOP: Read the synthetic quote log created by loadgen.
  file_log/quotes:
    include: [./quotes.log]
    start_at: beginning
    include_file_path: true
    resource:
      service.name: quote-generator
      com.splunk.source: ./quotes.log
      com.splunk.sourcetype: quotes

processors:
  batch:
    metadata_keys: [X-SF-Token]
  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
  resource_detection:
    detectors: [gcp, ecs, ec2, azure, system]
    override: true

  # WORKSHOP: Make Agent-mode telemetry obvious in local output.
  resource/add_mode:
    attributes:
      - action: upsert
        key: otelcol.service.mode
        value: agent

exporters:
  # DEFAULT: Traces to Splunk APM.
  otlp_http:
    traces_endpoint: "${SPLUNK_INGEST_URL}/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
    auth:
      authenticator: headers_setter
  # DEFAULT: Metrics, events, process-list data, and host metadata.
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    api_url: "${SPLUNK_API_URL}"
    ingest_url: "${SPLUNK_INGEST_URL}"
    sync_host_metadata: true
    correlation:
  # DEFAULT: Entity events when discovery mode is enabled.
  otlp_http/entities:
    logs_endpoint: "${SPLUNK_INGEST_URL}/v3/event"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"
    auth:
      authenticator: headers_setter
  # DEFAULT: Logs to a separately configured Splunk Platform HEC endpoint.
  splunk_hec:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: otel
    sourcetype: otel
    profiling_data_enabled: false
  # DEFAULT: Profiling data to Splunk Observability Cloud.
  splunk_hec/profiling:
    token: "${SPLUNK_ACCESS_TOKEN}"
    endpoint: "${SPLUNK_INGEST_URL}/v1/log"
    log_data_enabled: false

  # WORKSHOP: Detailed console output and local OTLP JSON files.
  debug:
    verbosity: detailed
  file/traces:
    path: ./agent-traces.out
    append: false
  file/metrics:
    path: ./agent-metrics.out
    append: false
  file/logs:
    path: ./agent-logs.out
    append: false

service:
  telemetry:
    logs:
      level: ${env:SPLUNK_COLLECTOR_LOG_LEVEL:-info}
    resource:
      attributes:
        - name: otelcol.service.mode
          value: agent
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions: [headers_setter, health_check, http_forwarder, http_forwarder/opamp_splunk_o11y, opamp/splunk_o11y, zpages]
  pipelines:
    traces:
      receivers: [jaeger, otlp, zipkin]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [otlp_http, debug, file/traces]
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [signalfx, debug, file/metrics]
    metrics/internal:
      receivers: [prometheus/internal]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [signalfx]
    logs/signalfx:
      receivers: [smartagent/processlist]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [signalfx]
    logs/entities:
      receivers: [nop]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [otlp_http/entities]
    logs:
      receivers: [fluent_forward, otlp, file_log/quotes]
      processors: [memory_limiter, resource/add_mode, batch, resource_detection]
      exporters: [splunk_hec, splunk_hec/profiling, debug, file/logs]
